<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>TalkTime</title>
<script>
  // App Store の ID（公開前は空）。空のあいだは App Store へのリンクと Smart App Banner を出さない
  var APP_STORE_ID = "";
  var APP_SCHEME = "talktime";
  var LINK_VERSION = "1";
  var MAX_LEAD_SECONDS = 24 * 60 * 60;

  (function () {
    // Smart App Banner は読み込み中に head へ書く必要がある
    if (!APP_STORE_ID) return;
    var query = window.location.search || "";
    var argument = APP_SCHEME + "://join" + query;
    document.write('<meta name="apple-itunes-app" content="app-id=' + encodeURIComponent(APP_STORE_ID) +
      ', app-argument=' + argument.replace(/"/g, "") + '">');
  })();
</script>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #15161a;
    --sub: #5f6370;
    --accent: #2f6bff;
    --accent-text: #ffffff;
    --warn: #b07a00;
    --danger: #d7261e;
    --chip: #eef1fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f13;
      --card: #1b1d24;
      --text: #f2f3f7;
      --sub: #a3a7b3;
      --accent: #6e96ff;
      --accent-text: #0e0f13;
      --warn: #ffd60a;
      --danger: #ff453a;
      --chip: #262a36;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
  }
  .brand { text-align: center; font-weight: 700; color: var(--sub); letter-spacing: .02em; }
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 28px 20px;
    margin-top: 16px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.06);
  }
  .label { font-size: 15px; font-weight: 600; color: var(--sub); }
  .tomorrow {
    display: inline-block;
    margin-bottom: 6px;
    padding: 2px 12px;
    border-radius: 999px;
    background: rgba(255, 196, 0, .25);
    font-weight: 700;
  }
  .end {
    font-size: clamp(40px, 13vw, 64px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
    margin: 4px 0;
  }
  .remaining { font-size: 20px; font-weight: 600; color: var(--sub); font-variant-numeric: tabular-nums; }
  .code { display: flex; gap: 10px; justify-content: center; margin: 10px 0 4px; }
  .code span {
    width: 54px; height: 66px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px;
    background: var(--chip);
    font-size: 36px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .button {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 18px 16px;
    border-radius: 18px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
  }
  .button.secondary { background: var(--chip); color: var(--accent); font-size: 17px; }
  .hint { margin-top: 16px; font-size: 15px; color: var(--sub); text-align: center; }
  .message { font-size: 20px; font-weight: 700; }
  .message.error { color: var(--danger); }
  .hidden { display: none !important; }
  footer { margin-top: 28px; text-align: center; font-size: 13px; color: var(--sub); }
  footer a { color: var(--sub); }
</style>
</head>
<body>
<main>
  <div class="brand">TalkTime</div>

  <section id="valid" class="card hidden" aria-live="polite">
    <div id="tomorrow" class="tomorrow hidden"></div>
    <div id="end" class="end"></div>
    <div id="remaining" class="remaining" role="timer"></div>
    <div style="margin-top:18px" class="label" id="code-label"></div>
    <div id="code" class="code" role="img"></div>
    <a id="open" class="button" href="#"></a>
    <a id="store" class="button secondary hidden" href="#"></a>
    <p id="hint" class="hint"></p>
  </section>

  <section id="ended" class="card hidden">
    <p id="ended-message" class="message"></p>
    <a id="store-ended" class="button secondary hidden" href="#"></a>
  </section>

  <section id="invalid" class="card hidden">
    <p id="invalid-message" class="message error"></p>
    <a id="store-invalid" class="button secondary hidden" href="#"></a>
  </section>

  <footer>
    <a href="./" id="about-link"></a> · <a href="./privacy.html" id="privacy-link"></a> · <a href="./support.html" id="support-link"></a>
  </footer>
</main>

<script>
(function () {
  var isJa = /^ja\b/i.test(navigator.language || "");
  document.documentElement.lang = isJa ? "ja" : "en";

  var T = isJa ? {
    endsAt: function (t) { return t + " に終了"; },
    tomorrow: "明日",
    left: function (h, m, s) { return "あと " + (h > 0 ? h + ":" + pad(m) : m) + ":" + pad(s); },
    leftSpoken: function (h, m, s) { return "あと" + (h > 0 ? h + "時間" : "") + m + "分" + s + "秒"; },
    code: "コード",
    open: "アプリで開く",
    store: "アプリを持っていない方（App Store）",
    hint: function (c) { return "開かないときは、アプリの「コードで参加」に " + c + " を入力してください。"; },
    ended: "このタイマーは終了しました",
    invalid: "このリンクは使えません。相手にコードを聞いてください",
    about: "TalkTime について", privacy: "プライバシーポリシー", support: "サポート"
  } : {
    endsAt: function (t) { return "Ends at " + t; },
    tomorrow: "Tomorrow",
    left: function (h, m, s) { return (h > 0 ? h + ":" + pad(m) : m) + ":" + pad(s) + " left"; },
    leftSpoken: function (h, m, s) { return (h > 0 ? h + " hr " : "") + m + " min " + s + " sec left"; },
    code: "Code",
    open: "Open in the app",
    store: "Don't have the app? (App Store)",
    hint: function (c) { return "If the app doesn't open, enter " + c + " in “Join with code”."; },
    ended: "This timer has ended.",
    invalid: "This link can't be used. Ask the other person for the code.",
    about: "About TalkTime", privacy: "Privacy Policy", support: "Support"
  };

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function $(id) { return document.getElementById(id); }
  function show(id) { ["valid", "ended", "invalid"].forEach(function (s) { $(s).classList.toggle("hidden", s !== id); }); }

  $("about-link").textContent = T.about;
  $("privacy-link").textContent = T.privacy;
  $("support-link").textContent = T.support;

  var storeURL = APP_STORE_ID ? "https://apps.apple.com/app/id" + encodeURIComponent(APP_STORE_ID) : "";
  ["store", "store-ended", "store-invalid"].forEach(function (id) {
    if (!storeURL) return;
    $(id).href = storeURL;
    $(id).textContent = T.store;
    $(id).classList.remove("hidden");
  });

  // ?end=<UNIX秒>&v=1 を検証する（アプリの JoinLink と同じ規則）
  var params = new URLSearchParams(window.location.search);
  var endText = params.get("end");
  var version = params.get("v");
  var nowSeconds = Date.now() / 1000;
  var valid = version === LINK_VERSION && endText !== null && /^\d+$/.test(endText);
  var end = valid ? parseInt(endText, 10) : NaN;
  valid = valid && end % 60 === 0 && end > nowSeconds && end - nowSeconds <= MAX_LEAD_SECONDS;

  if (!valid) {
    $("invalid-message").textContent = T.invalid;
    show("invalid");
    return;
  }

  var endDate = new Date(end * 1000);
  var hh = endDate.getHours(), mm = endDate.getMinutes();
  var timeText = hh + ":" + pad(mm);
  var code = pad(hh) + pad(mm);
  var now = new Date();
  var isTomorrow = endDate.toDateString() !== now.toDateString();

  if (isTomorrow) {
    $("tomorrow").textContent = T.tomorrow;
    $("tomorrow").classList.remove("hidden");
  }
  $("end").textContent = T.endsAt(timeText);
  $("code-label").textContent = T.code;
  $("code").setAttribute("aria-label", T.code + " " + code.split("").join(" "));
  code.split("").forEach(function (digit) {
    var span = document.createElement("span");
    span.textContent = digit;
    span.setAttribute("aria-hidden", "true");
    $("code").appendChild(span);
  });
  // ページを開いただけでは飛ばさない。必ずボタンを押してもらう
  $("open").href = APP_SCHEME + "://join?end=" + end + "&v=" + LINK_VERSION;
  $("open").textContent = T.open;
  $("hint").textContent = T.hint(code);
  show("valid");

  function tick() {
    var left = Math.ceil(end - Date.now() / 1000);
    if (left <= 0) {
      $("ended-message").textContent = T.ended;
      show("ended");
      return;
    }
    var h = Math.floor(left / 3600), m = Math.floor(left % 3600 / 60), s = left % 60;
    $("remaining").textContent = T.left(h, m, s);
    $("remaining").setAttribute("aria-label", T.leftSpoken(h, m, s));
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  tick();
})();
</script>
</body>
</html>
